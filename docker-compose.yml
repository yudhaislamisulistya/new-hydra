services:
  hydra_database:
    image: postgres:15-alpine
    container_name: hydra_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGRST_DB_PASSWORD: ${PGRST_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      TZ: Asia/Jakarta
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - hydra_postgres_local_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ./database/configure-service-roles.sh:/docker-entrypoint-initdb.d/01_service_roles.sh:ro
      - ./database/auth-schema.sql:/docker-entrypoint-initdb.d/02_auth_schema.sql:ro
      - ./database/auth-data.sql:/docker-entrypoint-initdb.d/03_auth_data.sql:ro
      - ./database/auth-migrations.sql:/docker-entrypoint-initdb.d/04_auth_migrations.sql:ro
      - ./database/supabase-schema.sql:/docker-entrypoint-initdb.d/10_supabase_schema.sql:ro
      - ./database/supabase-data.sql:/docker-entrypoint-initdb.d/20_supabase_data.sql:ro
      - ./database/local-security.sql:/docker-entrypoint-initdb.d/30_local_security.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - hydra_network

  hydra_auth:
    image: public.ecr.aws/supabase/gotrue:v2.195.0
    container_name: hydra_auth
    restart: unless-stopped
    depends_on:
      hydra_database:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD}@hydra_database:5432/${POSTGRES_DB}
      GOTRUE_DB_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - hydra_network

  hydra_api:
    image: postgrest/postgrest:v14.12
    container_name: hydra_postgrest_api
    restart: unless-stopped
    depends_on:
      hydra_database:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${PGRST_DB_PASSWORD}@hydra_database:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_MAX_ROWS: 1000
      PGRST_SERVER_PORT: 3000
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
      PGRST_ADMIN_SERVER_PORT: 3001
    ports:
      - "${POSTGREST_HOST_PORT}:3000"
    healthcheck:
      test: ["CMD", "/bin/postgrest", "--ready"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - hydra_network

  hydra_frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}
    image: hydra_frontend:latest
    container_name: hydra_frontend
    restart: unless-stopped
    depends_on:
      hydra_api:
        condition: service_healthy
      hydra_auth:
        condition: service_healthy
    environment:
      PGRST_UPSTREAM: http://hydra_api:3000
      AUTH_UPSTREAM: http://hydra_auth:9999
      NGINX_ENVSUBST_FILTER: PGRST_UPSTREAM|AUTH_UPSTREAM
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - hydra_network

volumes:
  hydra_postgres_local_data:
    external: true
    name: new-hydra_hydra_postgres_local_data

networks:
  hydra_network:
    driver: bridge
